# 默认字段设置
default:
  time_col: date
  value_col: value
  device: cpu
  dtype: float32
  seed: 42
  feature_cols: ["value"]

# 模型类型
model_type: lstm

# 通用阈值设置
thresholds:
  # 误差阈值：当验证集同时满足这两个阈值（logic=and）时，才允许早停
  MAPE: 0.05          # 5%
  RMSE: 10            # 10（与数据度量一致）
  early_stop_metric: MAPE   # 仍保留基准早停参考（不移除此键，保证兼容）

  # === 与训练早停联动的策略参数（当前链路：train_service -> pipeline -> trainer/adaptor）===
  apply_to: val             # 对哪一段进行阈值判断：val / test
  logic: and                # and / or：需要同时满足还是满足其一才允许停止
  enforce_in_early_stop: true   # 将阈值作为“允许停止”的前置条件
  patience_reset_if_worse: true # 若阈值未达标，则自动重置 patience 计数继续训练

metrics:
  robust_rmse: false        # 若想减少离群点影响，可改为 true（需在代码侧支持）

# 默认数据切分比例（用于 ARIMA 等读取 split 的模型）
split:
  train: 0.8
  val: 0.1
  test: 0.1

evaluation:
  backtest:
    enabled: false
    horizon: 1
    step: 1
    window: 24
    seasonal_period: 0

# 调参设置
optimization:
  n_trials: 50

# Prophet 参数
prophet:
  yearly_seasonality: true
  weekly_seasonality: false
  daily_seasonality: false
  seasonality_mode: additive
  changepoint_prior_scale: 0.05

# 多模型结构参数
model_config:
  Informer:
    seq_len: 96
    label_len: 48
    # Shorter training horizon; long horizon handled via rolling/dense 1-step inference.
    pred_len: 8
    d_model: 64
    d_ff: 192
    n_heads: 4
    e_layers: 3
    d_layers: 1
    dropout: 0.05
    factor: 3
    attn: prob
    # Validation metric mode:
    # - window: fast (uses window-based val metrics each epoch)
    # - rolling: slow (runs dense/rolling inference over the whole val segment each epoch)
    val_eval_mode: window
    batch_size: 16
    n_epochs: 30
    patience: 8
    learning_rate: 0.0002
    weight_decay: 0.0001
    embed: fixed
    freq: t
    enc_in: 1
    dec_in: 1
    c_out: 1
    # === 自动特征列（单/多变量）开关 ===
    auto_feature_cols: true                 # 为 true 时，若未显式指定 feature_cols，则自动从数据中推断
    feature_cols_strategy: all_numeric_except_time  # 自动策略：取所有数值列（排除 time_col），并将 value_col 放在首位
    lock_feature_order: true                # 训练确定列顺序后在预测端严格对齐顺序（不一致则报错）
    # === 预测端特征契约（缺列处理策略） ===
    feature_contract:
      recompute_policy: error               # 预测端：Repairable Core 重算失败则报错（默认安全）
    # === Train-only 特征筛选（MI + RF importance） ===
    feature_selection:
      missing_rate_threshold: 0.4
      low_variance_threshold: 1e-8
      redundant_corr_threshold: 0.95
      max_features: null
      leakage_name_patterns: ["label", "target", "future", "t+", "lead", "yhat", "predict"]
      # Feature tiers (generic missing-feature solution):
      # - Required Core: missing -> fail-fast (train/predict)
      # - Repairable Core: recompute; fail if cannot recompute
      # - Optional: missing/NaN -> removed from feature set and recorded
      required_core_cols: []                # extra required cores besides value_col
      repairable_core_cols: ["month", "day_of_month", "day_of_week", "hour", "day_of_year"]
      # Backward-compat alias (treated as required_core_cols if present)
      core_cols: []
      safe_default_cols: ["month", "day_of_month", "day_of_week", "hour", "day_of_year"]
    # 若 auto_feature_cols 为 true 且未显式给出 feature_cols，将按 feature_cols_strategy 自动推断
    # 若明确给出 feature_cols，则以该列表为准（并仍保证 value_col 在首位）
    feature_cols:        # Informer 主模型输入特征列表（支持多变量！）
      - value
      # - open
      # - high
      # - low
      # - volume
      # - temperature
      # - windspeed

  LSTM:
    seq_len: 60
    label_len: 30
    pred_len: 30
    hidden_dim: 128
    num_layers: 2
    batch_size: 64
    n_epochs: 20
    learning_rate: 0.001  

  ARIMA:
    mode: fixed
    use_seasonal: true
    seasonal_period: 24
    max_p: 2
    max_d: 1
    max_q: 2
    fixed_order: [1, 1, 1]
    rolling:
      enabled: false
      refit_every: 12
      forecast_h: 1
      use_refit_on_exception: true
      max_eval_points: 500
    train:
      max_train_rows: 5000
    weight_decay: 0.0001 
  XGBoost:
    # Train-only selection + strict missing policy are handled by the unified pipeline.
    # This model predicts value_col using the remaining feature columns.
    n_estimators: 2000
    learning_rate: 0.03
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    min_child_weight: 1.0
    gamma: 0.0
    early_stopping_rounds: 50
    tree_method: hist
    n_jobs: -1
  Prophet:
    yearly_seasonality: true
    weekly_seasonality: false
    daily_seasonality: false
    seasonality_mode: additive
    changepoint_prior_scale: 0.05
    seq_len: 90
    pred_len: 30

  RandomForest:
    # RF 默认参数；若启用 Optuna 调参，这些仅作为初始值参考
    n_lags: 10
    n_estimators: 200
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42

# Residual 模型设置
residual_modeling:
  enabled: true
  compare_metric: MAPE
  model_type: Ridge              # 支持 LinearRegression, Ridge, Lasso, MLP, etc
  multi_step: true               # 多步残差建模
  use_x_feature: true            # 是否拼接主模型特征
  feature_cols:                  # 残差建模可用特征
    - value
    # - open
    # - high
    # - temperature
  device: cpu
  dtype: float32

prediction:
  rolling:
    enabled: true
    step: 1
    mode: mean
    calibrate: true 
    variance_calibration:
      enabled: true
      k_mult: 2.0
      ratio_lb: 0.7
      ratio_ub: 1.5
  ui:
    horizons_hours: [24, 72, 168]   # 1天/3天/7天（按小时频率）。若为日频，可替换成 [1, 7, 14]
  degrade:
    enabled: false                   # 预测端降级模式：当 Required Core 缺失/特征不匹配时切换到基线并标记 degraded=True
    mode: naive_last                 # 目前实现：naive_last（持久性预测）

# Baseline settings
baseline:
  season_len: 0

quality_gate:
  enabled: true
  profile: dev
  missing_metric_policy: fail
  templates:
    dev:
      required_metrics:
        MAPE: 0.35
        RMSE: 120.0
        MAE: 90.0
      baseline:
        enabled: true
        max_degradation:
          MAPE: 0.10
          RMSE: 0.10
          MAE: 0.10
      missing_metric_policy: pass
    staging:
      required_metrics:
        MAPE: 0.30
        RMSE: 100.0
        MAE: 80.0
      baseline:
        enabled: true
        max_degradation:
          MAPE: 0.07
          RMSE: 0.07
          MAE: 0.07
      missing_metric_policy: fail
    prod:
      required_metrics:
        MAPE: 0.25
        RMSE: 90.0
        MAE: 70.0
      baseline:
        enabled: true
        max_degradation:
          MAPE: 0.05
          RMSE: 0.05
          MAE: 0.05
      missing_metric_policy: fail
  suggestion:
    enabled: true
    recent_runs: 20
    quantile: 0.8
    metrics: [MAPE, RMSE, MAE]

# 通用模型配置参数，包括阈值设定与模型默认结构

logging:
  level: DEBUG
  save_log: true
  log_path: logs/app.log

# Data preprocessing defaults
data_prep:
  missing:
    strategy: drop   # drop | fill
    fill_value: 0
    fill_method: ""  # ffill | bfill | ""
  resample:
    enabled: false
    freq: D
    agg: mean
  outlier:
    enabled: true
    lower_q: 0.01
    upper_q: 0.99
    columns: []

artifacts:
  model_path: artifacts/informer_model.pth
  scaler_path: artifacts/scaler.pkl
  residual_model_path: artifacts/residual_model.pkl
  # 训练端在此保存特征列定义及仅针对目标列的缩放器，预测端按此加载
  feature_cols_path: artifacts/feature_cols.json
  y_scaler_path: artifacts/value_scaler.pkl

# Debug 配置
debug:
  enabled: true
  print_shapes: true
  print_samples: true

services:
  api:
    env_file:
      - .env.prod
    ports:
      - "8002:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./Project/output:/app/Project/output

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    env_file:
      - .env.prod
    ports:
      - "80:80"
    depends_on:
      - api

  ui:
    env_file:
      - .env.prod
    ports:
      - "8503:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./Project/output:/app/Project/output

  worker:
    env_file:
      - .env.prod
    volumes:
      - ./artifacts:/app/artifacts
      - ./Project/output:/app/Project/output

  redis:
    ports: []

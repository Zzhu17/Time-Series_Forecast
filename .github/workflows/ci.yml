name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

jobs:
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: PYTHONPATH=Project mypy Project tests
      - name: Check test environment
        run: ./scripts/check_test_env.sh
      - name: Tests (minimal, allow skips)
        run: scripts/run_test_matrix.sh minimal
      - name: Record skip reasons
        run: cat skip-reasons-minimal.txt
      - name: Upload minimal skip report
        uses: actions/upload-artifact@v4
        with:
          name: minimal-skip-reasons
          path: skip-reasons-minimal.txt
      - name: Build failure bundle (minimal)
        if: failure()
        run: ./scripts/build_failure_bundle.sh minimal
      - name: Upload failure bundle (minimal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-bundle-minimal-${{ github.run_id }}
          path: failure_bundle/
      - name: Print failure artifact links and triage template
        if: failure()
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Failure artifacts: ${run_url}#artifacts"
          echo "Primary troubleshooting suggestion template:"
          echo "1) 环境层(Environment): 检查 pip-freeze.txt 与 check_test_env 输出是否缺包或版本冲突。"
          echo "2) 代码层(Code): 对照 pytest.log 第一处失败堆栈和改动文件定位回归点。"
          echo "3) 策略层(Policy): 查 quality-gate-report 与 skip-reasons 是否因门禁/skip 策略导致失败。"
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match VERSION $version"
            exit 1
          fi

  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Project/requirements.txt
          python -m pip install -r requirements-ci.txt
      - name: Tests (full)
        run: scripts/run_test_matrix.sh full
      - name: Model tests (full)
        run: scripts/run_test_matrix.sh models
      - name: Build failure bundle (full)
        if: failure()
        run: ./scripts/build_failure_bundle.sh full
      - name: Upload failure bundle (full)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-bundle-full-${{ github.run_id }}
          path: failure_bundle/
      - name: Print failure artifact links and triage template
        if: failure()
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Failure artifacts: ${run_url}#artifacts"
          echo "Primary troubleshooting suggestion template:"
          echo "1) 环境层(Environment): 检查 pip-freeze.txt 与 check_test_env 输出是否缺包或版本冲突。"
          echo "2) 代码层(Code): 对照 pytest.log 第一处失败堆栈和改动文件定位回归点。"
          echo "3) 策略层(Policy): 查 quality-gate-report 与 skip-reasons 是否因门禁/skip 策略导致失败。"

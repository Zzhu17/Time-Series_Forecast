name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

jobs:
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: PYTHONPATH=Project mypy Project tests
      - name: Check test environment
        run: ./scripts/check_test_env.sh
      - name: Tests (minimal, allow skips)
        run: scripts/run_test_matrix.sh minimal
      - name: Record skip reasons
        run: cat skip-reasons-minimal.txt
      - name: Upload minimal skip report
        uses: actions/upload-artifact@v4
        with:
          name: minimal-skip-reasons
          path: skip-reasons-minimal.txt
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match VERSION $version"
            exit 1
          fi

  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Project/requirements.txt
          python -m pip install -r requirements-ci.txt
      - name: Tests (full)
        run: scripts/run_test_matrix.sh full
      - name: Model tests (full)
        run: scripts/run_test_matrix.sh models
      - name: quality-gate-check
        id: quality_gate_check
        run: |
          python scripts/quality_gate_check.py \
            --history-size "${QUALITY_GATE_HISTORY_SIZE:-5}" \
            --degrade-streak-threshold "${QUALITY_GATE_DEGRADE_STREAK:-3}" \
            --output quality_gate_report.json
      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: quality_gate_report.json
      - name: PR comment for quality gate
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'quality_gate_report.json';
            let body = 'quality_gate_report.json was not generated.';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              body = [
                '### quality-gate-check',
                `- gate_passed: ${report.gate_passed}`,
                `- trend_status: ${report.trend_status}`,
                `- risk_level: ${report.risk_level}`,
              ].join('\n');
            }

            const marker = '### quality-gate-check';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const botComment = comments.find((c) => c.user.type === 'Bot' && c.body && c.body.includes(marker));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

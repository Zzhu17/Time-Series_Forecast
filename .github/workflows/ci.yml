name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve Python version for cache key
        id: py
        run: |
          python -c 'import sys; print(f"version={sys.version_info.major}.{sys.version_info.minor}")' >> "$GITHUB_OUTPUT"
      - name: Restore pip HTTP cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/http-v2
          key: ${{ runner.os }}-pip-http-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Restore pip wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: ${{ runner.os }}-pip-wheel-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Install dependencies (single entry)
        run: ./scripts/ci_install.sh --profile minimal
      - name: Fetch previous main skip metrics (best effort)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_prev_main_skip_metrics.py
      - name: Lint
        run: ruff check .
      - name: Type check
        run: PYTHONPATH=Project mypy Project tests
      - name: Check test environment
        run: ./scripts/check_test_env.sh
      - name: Tests (minimal, allow skips)
        run: scripts/run_test_matrix.sh minimal
      - name: Record skip reasons
        run: cat skip-reasons-minimal.txt
      - name: Build minimal skip metrics
        run: |
          python -c "import json; from pathlib import Path; p=Path('skip-reasons-minimal.txt'); c=p.read_text(encoding='utf-8') if p.exists() else ''; s=sum(1 for line in c.splitlines() if line.strip().startswith('SKIPPED')); Path('skip-metrics-minimal.json').write_text(json.dumps({'skipped': s}, indent=2)+'\n', encoding='utf-8')"
      - name: Upload minimal skip report
        uses: actions/upload-artifact@v4
        with:
          name: minimal-skip-reasons
          path: skip-reasons-minimal.txt
      - name: Upload minimal skip metrics
        uses: actions/upload-artifact@v4
        with:
          name: minimal-skip-metrics
          path: skip-metrics-minimal.json
      - name: Upload dependency freeze snapshots (minimal)
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze-minimal
          path: ci-artifacts/pip-freeze-*.txt
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match VERSION $version"
            exit 1
          fi

  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve Python version for cache key
        id: py
        run: |
          python -c 'import sys; print(f"version={sys.version_info.major}.{sys.version_info.minor}")' >> "$GITHUB_OUTPUT"
      - name: Restore pip HTTP cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/http-v2
          key: ${{ runner.os }}-pip-http-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Restore pip wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: ${{ runner.os }}-pip-wheel-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Install dependencies (single entry)
        run: ./scripts/ci_install.sh --profile full
      - name: Tests (full)
        run: scripts/run_test_matrix.sh full
      - name: Model tests (full)
        run: scripts/run_test_matrix.sh models
      - name: Upload dependency freeze snapshots (full)
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze-full
          path: ci-artifacts/pip-freeze-*.txt

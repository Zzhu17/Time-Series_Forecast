name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve Python version for cache key
        id: py
        run: |
          python -c 'import sys; print(f"version={sys.version_info.major}.{sys.version_info.minor}")' >> "$GITHUB_OUTPUT"
      - name: Restore pip HTTP cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/http-v2
          key: ${{ runner.os }}-pip-http-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Restore pip wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: ${{ runner.os }}-pip-wheel-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Install dependencies (single entry)
        run: ./scripts/ci_install.sh --profile minimal
      - name: Lint
        run: ruff check .
      - name: Type check
        run: PYTHONPATH=Project mypy Project tests
      - name: Check test environment
        run: ./scripts/check_test_env.sh
      - name: Tests (minimal, allow skips)
        run: scripts/run_test_matrix.sh minimal --enforce-skip-policy
      - name: Record skip reasons
        run: cat skip-reasons-minimal.txt
      - name: Upload minimal skip report
        uses: actions/upload-artifact@v4
        with:
          name: minimal-skip-reasons
          path: skip-reasons-minimal.txt
      - name: Upload dependency freeze snapshots (minimal)
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze-minimal
          path: ci-artifacts/pip-freeze-*.txt
      - name: Upload minimal skip metrics
        uses: actions/upload-artifact@v4
        with:
          name: minimal-skip-metrics
          path: skip-metrics-minimal.json
      - name: Fetch previous main skip metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          owner_repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          token = os.environ['GITHUB_TOKEN']
          api = f"https://api.github.com/repos/{owner_repo}"
          headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github+json',
          }

          def get_json(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req) as resp:
              return json.loads(resp.read().decode('utf-8'))

          runs = get_json(f"{api}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=10")
          candidate = None
          for run in runs.get('workflow_runs', []):
            if str(run.get('id')) != str(run_id):
              candidate = run
              break

          fallback = Path('skip-metrics-main-prev.json')
          if not candidate:
            fallback.write_text('{}\n', encoding='utf-8')
            raise SystemExit(0)

          artifacts = get_json(f"{api}/actions/runs/{candidate['id']}/artifacts")
          target = None
          for a in artifacts.get('artifacts', []):
            if a.get('name') == 'minimal-skip-metrics':
              target = a
              break

          if not target:
            fallback.write_text('{}\n', encoding='utf-8')
            raise SystemExit(0)

          req = urllib.request.Request(target['archive_download_url'], headers=headers)
          with urllib.request.urlopen(req) as resp:
            data = resp.read()

          Path('prev-main-artifact.zip').write_bytes(data)
          with zipfile.ZipFile('prev-main-artifact.zip') as zf:
            members = [n for n in zf.namelist() if n.endswith('.json')]
            if members:
              content = zf.read(members[0]).decode('utf-8')
              fallback.write_text(content, encoding='utf-8')
            else:
              fallback.write_text('{}\n', encoding='utf-8')
          PY
      - name: Append minimal skip summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          cur = json.loads(Path('skip-metrics-minimal.json').read_text(encoding='utf-8'))
          prev_path = Path('skip-metrics-main-prev.json')
          prev = json.loads(prev_path.read_text(encoding='utf-8')) if prev_path.exists() else {}

          cur_map = cur.get('reason_counts', {})
          prev_map = prev.get('reason_counts', {}) if isinstance(prev, dict) else {}

          lines = []
          lines.append('### Minimal matrix skip top reasons')
          for item in cur.get('top_reasons', []):
            lines.append(f"- {item['count']} | {item['reason']}")
          if not cur.get('top_reasons'):
            lines.append('- 0 | No skips reported.')

          lines.append('')
          lines.append('### Minimal matrix skip delta vs previous main')
          keys = set(cur_map) | set(prev_map)
          changes = []
          for k in sorted(keys):
            delta = int(cur_map.get(k, 0)) - int(prev_map.get(k, 0))
            if delta != 0:
              changes.append((delta, k, int(cur_map.get(k, 0)), int(prev_map.get(k, 0))))
          if changes:
            for delta, reason, curv, prevv in sorted(changes, key=lambda x: abs(x[0]), reverse=True)[:10]:
              sign = '+' if delta > 0 else ''
              lines.append(f"- {sign}{delta} | now={curv}, prev_main={prevv} | {reason}")
          else:
            lines.append('- No deltas against previous main run artifact.')

          with open(Path(os.environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
            f.write('\n'.join(lines) + '\n')
          PY
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match VERSION $version"
            exit 1
          fi

  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve Python version for cache key
        id: py
        run: |
          python -c 'import sys; print(f"version={sys.version_info.major}.{sys.version_info.minor}")' >> "$GITHUB_OUTPUT"
      - name: Restore pip HTTP cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/http-v2
          key: ${{ runner.os }}-pip-http-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Restore pip wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: ${{ runner.os }}-pip-wheel-py${{ steps.py.outputs.version }}-lock-${{ hashFiles('requirements.lock') }}
      - name: Install dependencies (single entry)
        run: ./scripts/ci_install.sh --profile full
      - name: Tests (full)
        run: scripts/run_test_matrix.sh full --enforce-skip-policy
      - name: Append full skip summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          cur = json.loads(Path('skip-metrics-full.json').read_text(encoding='utf-8'))
          lines = ['### Full matrix skip top reasons']
          for item in cur.get('top_reasons', []):
            lines.append(f"- {item['count']} | {item['reason']}")
          if not cur.get('top_reasons'):
            lines.append('- 0 | No skips reported.')
          with open(Path(os.environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
            f.write('\n'.join(lines) + '\n')
          PY
      - name: Model tests (full)
        run: scripts/run_test_matrix.sh models
      - name: Upload dependency freeze snapshots (full)
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze-full
          path: ci-artifacts/pip-freeze-*.txt

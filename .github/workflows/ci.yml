name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

jobs:
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: PYTHONPATH=Project mypy Project tests
      - name: Check test environment
        run: ./scripts/check_test_env.sh
      - name: Tests (minimal, allow skips)
        run: |
          set -o pipefail
          PYTHONPATH=Project pytest -q -rs tests | tee pytest-minimal.log
      - name: Record skip reasons
        run: |
          {
            echo "# Minimal skip summary"
            grep -E '^SKIPPED ' pytest-minimal.log || echo "No skips reported."
          } > skip-reasons-minimal.txt
          cat skip-reasons-minimal.txt
      - name: Upload minimal skip report
        uses: actions/upload-artifact@v4
        with:
          name: minimal-skip-reasons
          path: skip-reasons-minimal.txt
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match VERSION $version"
            exit 1
          fi

  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Project/requirements.txt
          python -m pip install -r requirements-ci.txt
      - name: Tests (full)
        run: |
          set -o pipefail
          PYTHONPATH=Project pytest -q -rs tests | tee pytest-full.log
      - name: Enforce skip policy for full matrix
        run: |
          if grep -qE '^SKIPPED ' pytest-full.log; then
            bad_skips=$(grep -E '^SKIPPED ' pytest-full.log | grep -vc 'TEST_MATRIX_PLATFORM_SKIP:' || true)
            if [ "${bad_skips}" -gt 0 ]; then
              echo "Found non-platform skips in full matrix: ${bad_skips}"
              grep -E '^SKIPPED ' pytest-full.log
              exit 1
            fi
          fi
      - name: Model tests (full)
        run: make test-models
